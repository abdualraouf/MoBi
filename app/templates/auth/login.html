{% extends "base.html" %}

{% block title %}تسجيل الدخول | MoBi{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg mb-3">
                📱
            </div>
            <h2 class="text-2xl font-black text-gray-800">نظام MoBi لمحل الهواتف</h2>
            <p class="text-sm text-gray-500 mt-1">تسجيل الدخول لنقطة البيع والصيانة</p>
        </div>

        <!-- Form -->
        <form method="POST" action="/auth/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">اسم المستخدم</label>
                <input type="text" name="username" required id="login-username"
                       placeholder="مثال: admin"
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                <input type="password" name="password" required id="login-password"
                       placeholder="••••••••"
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-md hover:shadow-lg transition text-base">
                دخول للنظام
            </button>
        </form>

        <!-- Quick Credentials Hint for initial usage -->
        <div class="mt-6 pt-6 border-t border-gray-100">
            <p class="text-xs text-gray-400 text-center mb-2 font-medium">حسابات تجريبية سريعة بنقرة زر:</p>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="fillCreds('admin', 'admin123')"
                        class="text-xs bg-gray-50 hover:bg-blue-50 hover:text-blue-600 border border-gray-200 py-1.5 px-2 rounded text-center transition font-semibold">
                    المدير
                </button>
                <button type="button" onclick="fillCreds('cashier', 'cashier123')"
                        class="text-xs bg-gray-50 hover:bg-blue-50 hover:text-blue-600 border border-gray-200 py-1.5 px-2 rounded text-center transition font-semibold">
                    الكاشير
                </button>
                <button type="button" onclick="fillCreds('tech', 'tech123')"
                        class="text-xs bg-gray-50 hover:bg-blue-50 hover:text-blue-600 border border-gray-200 py-1.5 px-2 rounded text-center transition font-semibold">
                    فني الصيانة
                </button>
            </div>
        </div>

    </div>
</div>

<script>
function fillCreds(u, p) {
    document.getElementById('login-username').value = u;
    document.getElementById('login-password').value = p;
}
</script>
{% endblock %}
